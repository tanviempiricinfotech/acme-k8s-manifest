apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: payments

resources:
  - ../../payments/namespace.yaml
  - ../../payments/deployments.yaml
  - ../../payments/pdbs.yaml
  - ../../payments/hpas.yaml

patches:
  - path: batch-settlement-pdb-patch.yaml
    target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: batch-settlement-pdb

commonAnnotations:
  acme.io/overlay: payments-prod
