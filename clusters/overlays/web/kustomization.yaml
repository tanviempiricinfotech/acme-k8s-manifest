apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: web

resources:
  - ../../web/namespace.yaml
  - ../../web/deployments.yaml
  - ../../web/pdbs.yaml
  - ../../web/hpas.yaml
  - ../../web/vpa.yaml

patches:
  - path: partner-widget-pdb-patch.yaml
    target:
      group: policy
      version: v1
      kind: PodDisruptionBudget
      name: partner-widget-pdb

commonAnnotations:
  acme.io/overlay: web-prod
