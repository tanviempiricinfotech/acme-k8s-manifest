apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-frontend
  namespace: web
  labels:
    app: web-frontend
    team: web
    app.kubernetes.io/name: web-frontend
    app.kubernetes.io/instance: web-frontend-prod
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/managed-by: Argo CD
  annotations:
    deployment.kubernetes.io/revision: "112"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: web-frontend
  template:
    metadata:
      labels:
        app: web-frontend
        team: web
    spec:
      containers:
        - name: web-frontend
          image: registry.acme.internal/web/web-frontend:8.4.1
          ports:
            - containerPort: 3000
          resources:
            requests:
              cpu: 220m
              memory: 320Mi
            limits:
              cpu: 800m
              memory: 640Mi
