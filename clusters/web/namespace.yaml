apiVersion: v1
kind: Namespace
metadata:
  name: web
  labels:
    env: prod
    team: web
    app.kubernetes.io/part-of: acme-platform
    pod-security.kubernetes.io/enforce: baseline
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: web-compute-quota
  namespace: web
  annotations:
    argocd.argoproj.io/tracking-id: web:v1/ResourceQuota:web/web-compute-quota
spec:
  hard:
    requests.cpu: "22"
    requests.memory: 48Gi
    limits.cpu: "48"
    limits.memory: 96Gi
    pods: "80"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: web-defaults
  namespace: web
spec:
  limits:
    - type: Container
      default:
        cpu: 600m
        memory: 640Mi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      max:
        cpu: "3"
        memory: 6Gi
