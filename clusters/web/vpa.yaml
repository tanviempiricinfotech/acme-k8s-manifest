apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: api-gateway-vpa
  namespace: web
  labels:
    app: api-gateway
    team: web
  annotations:
    acme.io/added-by: platform-cost-initiative
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api-gateway
  updatePolicy:
    updateMode: Auto
  resourcePolicy:
    containerPolicies:
      - containerName: api-gateway
        minAllowed:
          cpu: 200m
          memory: 384Mi
        maxAllowed:
          cpu: 2000m
          memory: 2560Mi
        controlledResources:
          - cpu
          - memory
