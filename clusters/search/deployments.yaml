apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-indexer
  namespace: search
  labels:
    app: search-indexer
    team: search
    app.kubernetes.io/name: search-indexer
    app.kubernetes.io/instance: search-indexer-prod
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/managed-by: Argo CD
  annotations:
    deployment.kubernetes.io/revision: "18"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 0
  selector:
    matchLabels:
      app: search-indexer
  template:
    metadata:
      labels:
        app: search-indexer
        team: search
    spec:
      containers:
        - name: search-indexer
          image: registry.acme.internal/search/search-indexer:5.3.9
          resources:
            requests:
              cpu: 350m
              memory: 768Mi
            limits:
              cpu: 1400m
              memory: 1536Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  namespace: search
  labels:
    app: query-api
    team: search
    app.kubernetes.io/name: query-api
    app.kubernetes.io/instance: query-api-prod
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/managed-by: Argo CD
  annotations:
    deployment.kubernetes.io/revision: "63"
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: query-api
  template:
    metadata:
      labels:
        app: query-api
        team: search
        tier: serving
    spec:
      containers:
        - name: query-api
          image: registry.acme.internal/search/query-api:7.2.4
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 300m
              memory: 512Mi
            limits:
              cpu: 1100m
              memory: 1024Mi
---
