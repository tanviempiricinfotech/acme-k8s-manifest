apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: search-indexer-pdb
  namespace: search
  labels:
    app: search-indexer
    team: search
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: search-indexer
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: serving-tier-pdb
  namespace: search
  labels:
    team: search
  annotations:
    acme.io/owner-note: "shared budget for the serving tier"
spec:
  minAvailable: 4
  selector:
    matchLabels:
      tier: serving
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
