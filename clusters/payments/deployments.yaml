apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-api
  namespace: payments
  labels:
    app: checkout-api
    team: payments
    app.kubernetes.io/name: checkout-api
    app.kubernetes.io/instance: checkout-api-prod
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/managed-by: Argo CD
  annotations:
    deployment.kubernetes.io/revision: "47"
    argocd.argoproj.io/tracking-id: payments:apps/Deployment:payments/checkout-api
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  selector:
    matchLabels:
      app: checkout-api
  template:
    metadata:
      labels:
        app: checkout-api
        team: payments
      annotations:
        checksum/config: 9c1f4ae2b7
    spec:
      containers:
        - name: checkout-api
          image: registry.acme.internal/payments/checkout-api:3.14.2
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: 900m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: 8080
            initialDelaySeconds: 6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-coordinator
  namespace: payments
  labels:
    app: ledger-coordinator
    team: payments
    app.kubernetes.io/name: ledger-coordinator
    app.kubernetes.io/instance: ledger-coordinator-prod
    app.kubernetes.io/part-of: acme-platform
    app.kubernetes.io/component: quorum
    app.kubernetes.io/managed-by: Argo CD
  annotations:
    deployment.kubernetes.io/revision: "12"
    acme.io/consensus-note: "raft group requires a strict majority of 3 members online"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: ledger-coordinator
  template:
    metadata:
      labels:
        app: ledger-coordinator
        team: payments
        app.kubernetes.io/component: quorum
    spec:
      containers:
        - name: ledger-coordinator
          image: registry.acme.internal/payments/ledger-coordinator:2.8.1
          ports:
            - containerPort: 7070
          resources:
            requests:
              cpu: 300m
              memory: 640Mi
            limits:
              cpu: 1200m
              memory: 1280Mi
